<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundBoard - Memes</title>
    <link rel="shortcut icon" href="/assets/images/bateria.png" type="image/x-icon">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body onresize="mudarTamanho()">
<body>
    <header>
        <button class="voltar" onclick="window.location.href='index.html'">
            <h1 class="voltar-titulo">Voltar</h1>
        </button>
    </header>
    <main>
        <h1>JOGOS</h1>
        <div id="destaque-som" class="destaque-som visible">
            <img id="imagem-destaque" class="destaque-som__imagem" src="./imagens/Jogos/moeda.jpg" alt="Imagem do som em destaque">
        </div>
        <section class="teclado">
            <button class="tecla tecla_moedas"><img src="./imagens/Jogos/moeda.jpg" alt="Moedas"></button>
            <button class="tecla tecla_pulo"><img src="./imagens/Jogos/pulo.jpg" alt="Pulo"></button>
            <button class="tecla tecla_tiro"><img src="./imagens/Jogos/tiro.jpg" alt="Tiro"></button>

            <button class="tecla tecla_explosao"><img src="./imagens/Jogos/explosao.jpg" alt="Explosão"></button>
            <button class="tecla tecla_laser"><img src="./imagens/Jogos/laser.jpg" alt="Laser"></button>
            <button class="tecla tecla_xp"><img src="./imagens/Jogos/xp.png" alt="XP"></button>

           
        </section>
    </main>
    <footer></footer>
    <audio  src="./assets/Jogos/26f8b9_sonic_ring_sound_effect.mp3" id="som_tecla_moedas"></audio>
    <audio  src="./assets/Jogos/maro-jump-sound-effect_1.mp3" id="som_tecla_pulo"></audio>
    <audio  src="./assets/Jogos/tiro-escopeta.mp3" id="som_tecla_tiro"></audio>

    <audio  src="./assets/Jogos/Arcade retro game explosion echo sound effect SFX (HD).mp3" id="som_tecla_explosao"></audio>
    <audio  src="./assets/Jogos/Retro Arcade Laser Shoot Sound Effect Pack.mp3" id="som_tecla_laser"></audio>
    <audio  src="./assets/Jogos/orb.mp3" id="som_tecla_xp"></audio>

    <script src="scripts/app.js"></script>
</body>
</html>
