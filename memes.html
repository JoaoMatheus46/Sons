<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundBoard - Memes</title>
    <link rel="shortcut icon" href="/assets/images/bateria.png" type="image/x-icon">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body onresize="mudarTamanho()">
    <header>
        <button class="voltar" onclick="window.location.href='index.html'">
            <h1 class="voltar-titulo">Voltar</h1>
        </button>
    </header>
    <main>
        <h1>MEMES</h1>

        <div id="destaque-som" class="destaque-som visible">
            <img id="imagem-destaque" class="destaque-som__imagem" src="./imagens/kiko.jpg" alt="Imagem do som em destaque">
        </div>
        <section class="teclado">
            <button class="tecla tecla_kiko"><img src="./imagens/kiko.jpg" alt="Kiko"></button>
            <button class="tecla tecla_cavalo"><img src="./imagens/cavalo.jpg" alt="Cavalo"></button>
            <button class="tecla tecla_fah"><img src="./imagens/faahh.jpg" alt="Fah"></button>

            <button class="tecla tecla_bark"><img src="./imagens/cachorro.jpg" alt="Bark"></button>
            <button class="tecla tecla_enrique"><img src="./imagens/enrique.jpg" alt="Enrique"></button>
            <button class="tecla tecla_omg"><img src="./imagens/omg.jpg" alt="OMG"></button>

           
        </section>
    </main>
    <footer></footer>
    <audio  src="./assets/Memes/risada-do-kiko-half-clean-version.mp3" id="som_tecla_kiko"></audio>
    <audio  src="./assets/Memes/cavalo-rodrigo-faro.mp3" id="som_tecla_cavalo"></audio>
    <audio  src="./assets/Memes/faaah.mp3" id="som_tecla_fah"></audio>

    <audio  src="./assets/Memes/bark-fart_XRsy1HE.mp3" id="som_tecla_bark"></audio>
    <audio  src="./assets/Memes/enrique.mp3" id="som_tecla_enrique"></audio>
    <audio  src="./assets/Memes/oh-my-god-meme.mp3" id="som_tecla_omg"></audio>

    <script src="scripts/app.js"></script>
</body>
</html>
